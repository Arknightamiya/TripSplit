<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TripSplit</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">CS130 Project Scaffold</p>
        <h1>TripSplit</h1>
        <p class="hero-copy">
          Plan group trips, track shared spending, and settle balances fairly.
        </p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Your Trips</h2>
          <span id="status-text" class="hint">Connecting to the local API.</span>
        </div>
        <form id="trip-form" class="input-row">
          <input
            id="trip-name"
            name="name"
            placeholder="Enter a trip name"
            value="Big Bear Weekend"
            required
          />
          <button type="submit">Add Trip</button>
        </form>
        <div id="trip-list" class="stack"></div>
      </section>

      <section id="trip-detail" class="trip-detail" hidden>
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow" id="detail-eyebrow">Trip</p>
              <h2 id="detail-title">Trip Detail</h2>
              <p class="hint" id="detail-meta"></p>
            </div>
            <button type="button" id="detail-close" class="button-ghost">Close</button>
          </div>
          <div id="detail-participants" class="chip-row"></div>
        </div>

        <div id="budget-panel" class="panel"></div>
        <div id="expenses-panel" class="panel"></div>
        <div id="balances-panel" class="panel"></div>
      </section>
    </main>

    <script type="module" src="/web/app.js"></script>
  </body>
</html>
